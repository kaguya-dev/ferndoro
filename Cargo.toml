[package]
name = "ferndoro"
version = "0.1.0"
edition = "2021"
authors = ["Enzo <enzor>"]
description = "A high-contrast purple dark study companion featuring Pomodoro, Study Cycle planner, and Frequency Tracker"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
