<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A142A"/>
      <stop offset="100%" stop-color="#0F0C18"/>
    </linearGradient>
    <linearGradient id="dial-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bg-grad)" stroke="#4F2E80" stroke-width="3" />

  <!-- Outer Track -->
  <circle cx="128" cy="128" r="80" fill="none" stroke="#251C3D" stroke-width="12" />

  <!-- Glowing Progress Arc -->
  <circle cx="128" cy="128" r="80" fill="none" stroke="url(#dial-grad)" stroke-width="12" stroke-dasharray="380" stroke-dashoffset="110" stroke-linecap="round" filter="url(#glow)" />

  <!-- Indicator Dot -->
  <circle cx="198" cy="88" r="7" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="198" cy="88" r="4" fill="#A855F7" />

  <!-- Central Fern / Sprout Motif -->
  <path d="M128 175 V105" stroke="#34D399" stroke-width="5" stroke-linecap="round" />
  <!-- Left fronds -->
  <path d="M128 155 Q105 150 98 135 Q115 135 128 145" fill="#34D399" opacity="0.9" />
  <path d="M128 135 Q110 128 106 115 Q120 115 128 125" fill="#34D399" opacity="0.95" />
  <!-- Right fronds -->
  <path d="M128 145 Q151 140 158 125 Q141 125 128 135" fill="#34D399" opacity="0.9" />
  <path d="M128 125 Q146 118 150 105 Q136 105 128 115" fill="#34D399" opacity="0.95" />
  <!-- Top apex sprout -->
  <path d="M128 105 Q128 92 124 85 Q133 92 128 105" fill="#34D399" />
</svg>
